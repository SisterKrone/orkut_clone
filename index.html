<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Sister's Orkut</title>
</head>

<body>
    <div class="logo">
        <img src="/imgs/Logo_ORKUT.svg.png" alt="Orkut-Logo">
    </div>
    <div class="container">
        <h4 class="field__title">Acesse o
            <span class="pink-font">Orkut</span>
            com sua conta
            <span style="color: rgb(83, 83, 255);">G</span><span style="color: red;">o</span><span
                style="color: rgb(250, 132, 6);">o</span><span style="color: rgb(83, 83, 255);">g</span><span
                style="color: rgb(2, 185, 2);">l</span><span style="color: red;">e</span>

            !
        </h4>
        <input type="email" class="field__email" placeholder="E-mail ou número de celular">
        <input type="password" class="field__password" placeholder="Senha">
        <div class="fiels__remember">
            <input type="checkbox" id="field__remember">
            <label for="field__remember">Lembrar sempre o meu acesso</label>
        </div>
        <button class="field__login">Entrar</button>
        <a href="#" class="field__forgot">Esqueci minha senha ou e-mail</a>
        <p class="field__create">Não tem conta? <a href="#" class="pink-font">Criar agora</a></p>
    </div>

</body>

</html>
