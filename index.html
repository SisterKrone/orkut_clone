<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Sister's Orkut</title>
</head>

<body>
    <div class="container">
        <h4 class="fields__title">Acesse o Orkut com sua conta Google.</h4>
        <input type="email" class="field__email" placeholder="E-mail ou número de celular">
        <input type="password" class="field__password" placeholder="Senha">
        <div class="fiels__remember">
            <input type="checkbox" class="field__remember" id="field__remember">
            <label for="field__remember">Lembrar sempre o meu acesso</label>
        </div>
        <button>Entrar</button>
        <a href="#">Esqueci minha senha ou e-mail</a>
    </div>

</body>

</html>
